[package]
name        = "a3chat-app"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "a3chat business services: ChatService, ContactService, GroupService, SyncService, PresenceService. Sits between a3chat-rpc (RPC layer) and a3chat-core (domain types), backed by a3net-chatstore for persistence and a3chat-crypto for E2E."

[lints]
workspace = true

[dependencies]
# Internal A3Net deps
a3chat-core                = { workspace = true }
a3chat-crypto              = { workspace = true }
a3net-types                = { workspace = true }
a3net-chatstore            = { workspace = true }
a3net-roster               = { workspace = true }
a3net-userstore            = { workspace = true }
a3net-blobstore            = { workspace = true }
a3net-moderation           = { workspace = true }
a3net-reputation           = { workspace = true }
# Moments / 朋友圈 (F-05) — the bridge in
# `crates/a3chat-app/src/moments_service.rs` wraps the canonical
# `a3net-socialfeed` runtime. Required because the integration
# reuses SQLite persistence, gossip fan-out, and Validate-gated
# records directly rather than re-implementing them.
a3net-socialfeed           = { workspace = true }
a3net-gossip               = { workspace = true }
a3net-ipc                  = { workspace = true }

# Async runtime
tokio                      = { workspace = true, features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }
async-trait                = { workspace = true }
futures                    = { workspace = true }
async-stream               = { workspace = true }

# Error handling
thiserror                  = { workspace = true }

# Serialization
serde                      = { workspace = true }
serde_json                 = { workspace = true }
hex                        = { workspace = true }

# Time / IDs
chrono                     = { workspace = true }
uuid                       = { workspace = true }

# Crypto / hashing
blake3                     = { workspace = true }

# Persistence
rusqlite                   = { version = "0.32", features = ["bundled"] }

# Encoding for QR / wire payloads
base64                     = { workspace = true }
dashmap                    = { workspace = true }
parking_lot                = { workspace = true }

# Compression for sync payloads
zstd                       = { version = "0.13", default-features = false }

# Diagnostics — `tracing` is used by `moments_service`, `sse`,
# `notification_bus`, and several integration tests that need
# `eprintln!`-free structured logs.
tracing                    = { workspace = true }
# Tests construct temp SQLite / blob dirs via `tempfile`; the
# helper is also exposed (non-test) for `ProfileService::open`
# paths that fall back to a tempdir when none is configured.
tempfile                   = { workspace = true }

# Phase 5b: optional iroh-docs backend. When the `iroh` feature
# is on, `ChatStorage` dual-writes every outbound message to an
# `IrohDocsChat` alongside SQLite. This gives us a distributed
# message stream (CRDT-style merge, gossip sync) while keeping
# the conversation metadata / moderation / E2E keyring in SQLite.
# The iroh deps are kept optional so `a3chat-app` can still be
# compiled without them (useful for slim embedded targets).
iroh                        = { version = "=1.0.3",   optional = true, default-features = false, features = ["tls-ring"] }
iroh-blobs                 = { version = "=0.103.0", optional = true, default-features = false, features = ["fs-store"] }
iroh-docs                  = { version = "=0.101.0", optional = true, default-features = false, features = ["fs-store"] }
iroh-gossip                = { version = "=0.101.0", optional = true, default-features = false, features = ["net"] }

[features]
# Phase 5b: dual-write to iroh-docs. When enabled, `ChatStorage`
# appends every outbound message to an `IrohDocsChat` Doc in parallel
# with the SQLite write. This feature is independent of
# `a3net-chatstore`'s `iroh` feature — here we just need the
# `IrohDocsChat` bridge (which re-exports `docs_bridge`) so we must
# also activate `a3net-chatstore/iroh`.
#
# Note: `a3net-chatstore` is already a mandatory dependency (used for
# `ChatTrustStore` / `LinkBookmarkStore`). We flip its `iroh` feature
# on here so it exports `docs_bridge` with the `IrohDocsChat` type.
default = []
iroh = [
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:iroh-docs",
    "dep:iroh-gossip",
    "a3net-chatstore/iroh",
]

[dev-dependencies]
tempfile                   = { workspace = true }
tokio                      = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }