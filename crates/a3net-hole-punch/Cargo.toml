[package]
name         = "a3net-hole-punch"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
authors      = { workspace = true }
description  = "Pluggable hole-punching / address-discovery orchestrator for iroh-based A3Net peers. Bundles ticket, mDNS, Mainline DHT, and Pkarr/DNS strategies under a single race-all planner with diagnostics."

[lints]
workspace = true

[dependencies]
# Async runtime
tokio       = { workspace = true }
futures     = { workspace = true }
async-trait = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }

# Time / IDs
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow    = { workspace = true }

# Internal types
a3net-types = { workspace = true }

# Optional iroh 1.0 integration. When the `iroh` feature is enabled,
# the [`iroh_bridge`] module wires the planner directly into iroh's
# `AddressLookup` trait so a bound `Endpoint` can use the planner as
# a single resolver. When disabled, the planner works stand-alone
# (production paths embed via `a3net-transport::iroh::discovery`).
iroh           = { version = "=1.0.3", optional = true, default-features = false, features = ["tls-ring"] }
iroh-base      = { version = "=1.0.3", optional = true, default-features = false, features = ["key", "relay"] }
pkarr          = { version = "=8.0.0",  optional = true, default-features = false, features = ["relays"] }
n0-future      = { version = "0.1",    optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tempfile = { workspace = true }

[features]
# Default: pure-rust planner that doesn't depend on iroh. Operators
# wire the planner into `a3net-transport::iroh::discovery::DiscoveryBuilder`
# by hand (the `examples/builder.rs` route shows the pattern).
default = []
# Opt-in iroh 1.0 bridge. Pulls in `iroh`, `iroh-base`, `pkarr`, and
# `n0-future` so the modules under `src/iroh_bridge` compile.
iroh = [
    "dep:iroh",
    "dep:iroh-base",
    "dep:pkarr",
    "dep:n0-future",
]
