[package]
name        = "a3chat-cli"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "a3chat command-line client — DO-178C-style audit, doctor, and operator tooling for the a3chat distributed communication stack."

[lints]
workspace = true

[[bin]]
name = "a3chat"
path = "src/main.rs"

[lib]
name = "a3chat_cli"
path = "src/lib.rs"

[dependencies]
# Internal a3chat stack
a3chat-core            = { workspace = true }
a3chat-app             = { workspace = true }
a3chat-rpc             = { workspace = true }

# Async runtime
tokio                  = { workspace = true, features = ["full"] }
async-trait            = { workspace = true }
futures                = { workspace = true }

# Error handling
thiserror              = { workspace = true }
anyhow                 = { workspace = true }

# Serialization
serde                  = { workspace = true, features = ["derive"] }
serde_json             = { workspace = true }
toml                   = "0.8"

# Time / hashing
chrono                 = { workspace = true }
sha2                   = { workspace = true }
hex                    = { workspace = true }

# CLI parsing + completion
clap                   = { workspace = true, features = ["env"] }
clap_complete          = "4"

# HTTP client (for talking to a3chat-rpc daemon)
reqwest                = { workspace = true }
base64                 = { workspace = true }
uuid                   = { workspace = true }
eventsource-stream     = "0.2"
# QR rendering for the `contact qr-invite-render` subcommand.
a3net-qr               = { workspace = true }

# Logging / observability
tracing                = { workspace = true }
tracing-subscriber     = { workspace = true }

# Optional iroh-docs backend for `a3chatd --enable-iroh`. Pulls in
# iroh-docs / iroh / iroh-blobs / iroh-gossip. Off by default so the
# CLI binary stays slim; flip on with `--features enable-iroh`.
a3net-chatstore         = { workspace = true, optional = true }
a3net-blobstore         = { workspace = true, optional = true }
iroh                    = { version = "=1.0.3",   optional = true, default-features = false, features = ["tls-ring"] }
iroh-blobs              = { version = "=0.103.0", optional = true, default-features = false, features = ["fs-store"] }
iroh-docs               = { version = "=0.101.0", optional = true, default-features = false, features = ["fs-store"] }
iroh-gossip             = { version = "=0.101.0", optional = true, default-features = false, features = ["net"] }

[features]
# Off by default — keeps `cargo install a3chat-cli` lean.
default = []
# Compile the iroh-docs + iroh-blobs bridge so `a3chatd --enable-iroh`
# can spin up a DocsApi / IrohDocsChat at boot. Mirrors the `iroh`
# feature on `a3net-chatstore` so the CLI, app, and chatstore all
# agree on whether the iroh backend is present.
enable-iroh = [
    "a3net-blobstore/iroh",
    "a3net-blobstore",
    "a3net-chatstore/iroh",
    "a3net-chatstore",
    "a3chat-app/iroh",
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:iroh-docs",
    "dep:iroh-gossip",
]

[dev-dependencies]
tempfile               = "3"
tokio                  = { workspace = true, features = ["full", "macros", "test-util"] }
serial_test            = "3"
eventsource-stream     = "0.2"
futures                = { workspace = true }