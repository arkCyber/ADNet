[package]
name        = "a3net-invite"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "A3Net email invitation layer — builds and parses signed pairing invitations over SMTP/IMAP."

[lints]
workspace = true

[dependencies]
a3net-pairing = { workspace = true }
a3net-mail    = { workspace = true }
a3net-qr      = { workspace = true }

serde_json = { workspace = true }
thiserror  = { workspace = true }
log        = "0.4"
base64     = "0.22"

[dev-dependencies]
tempfile = { workspace = true }
a3net-identity = { workspace = true }
a3net-types    = { workspace = true }
chrono         = { workspace = true }
tokio          = { workspace = true, features = ["full"] }
anyhow         = { workspace = true }
hex            = "0.4"