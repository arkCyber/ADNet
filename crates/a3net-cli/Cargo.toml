[package]
name        = "a3net-cli"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "A3Net CLI — demo command-line entrypoint."

[lints]
workspace = true

[[bin]]
name = "a3net"
path = "src/main.rs"

[dependencies]
a3net-types     = { workspace = true }
a3net-blobstore = { workspace = true, features = ["scope", "bitswap"] }
a3net-gossip    = { workspace = true }
a3net-mesh      = { workspace = true }
a3net-transport = { workspace = true }
a3net-node      = { workspace = true, features = ["bitswap", "agent-v1", "audit"] }
tokio           = { workspace = true }
clap            = { workspace = true }
anyhow          = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
tracing         = { workspace = true }
tracing-subscriber = { workspace = true }
chrono          = { workspace = true }
hex             = { workspace = true }
futures         = { workspace = true }
blake3          = { workspace = true }
postcard        = { workspace = true, features = ["use-std"] }

# Extended features
a3net-roster        = { workspace = true }
a3net-share         = { workspace = true }
a3net-socialfeed    = { workspace = true }
a3net-news          = { workspace = true }
a3net-userstore     = { workspace = true }
a3net-observability = { workspace = true, features = ["http-server"] }
a3net-tui          = { workspace = true }
a3net-relay         = { workspace = true }
a3net-namespace     = { workspace = true }
a3net-ipc           = { workspace = true }
thiserror           = { workspace = true }
tokio-stream        = "0.1"
reqwest                  = { workspace = true, features = ["json", "stream"] }
async-stream             = { workspace = true }
indicatif           = { workspace = true }
dirs                = "5"
json5               = "1.3"
tempfile            = "3"

# Surface the device-pairing, email-invite, QR provisioning and
# mesh-coordinator crates that already ship as workspace members
# but were previously unreachable from the CLI.
a3net-pairing            = { workspace = true }
a3net-invite             = { workspace = true }
a3net-qr                 = { workspace = true }
a3net-mesh-coordinator   = { workspace = true }
a3net-mesh-firewall      = { workspace = true }
a3net-webhook            = { workspace = true }
rand                     = { workspace = true }
base64                   = { workspace = true }