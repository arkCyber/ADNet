<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>a3chat — Login</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    body {
      margin: 0;
      padding: 32px 16px;
      background: #0e1116;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }
    h1 { font-size: 18px; margin: 0 0 8px 0; font-weight: 600; }
    label { display: block; font-size: 12px; opacity: 0.8; margin: 8px 0 4px; }
    input {
      width: 280px;
      padding: 8px 10px;
      font-size: 13px;
      background: #1a1f29;
      border: 1px solid #2a3340;
      border-radius: 4px;
      color: #e6e6e6;
    }
    button {
      margin-top: 16px;
      width: 280px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #2a3340; cursor: not-allowed; }
    .indicator {
      font-size: 11px;
      opacity: 0.6;
      margin-top: 8px;
    }
    .error {
      color: #f87171;
      font-size: 11px;
      margin-top: 4px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h1>a3chat — Login</h1>
  <label>Daemon URL</label>
  <input id="base_url" value="http://127.0.0.1:53421" />
  <label>Owner (NodeId)</label>
  <input id="owner" placeholder="64-hex NodeId" />
  <button id="login">Connect</button>
  <div id="error" class="error"></div>
  <div id="indicator" class="indicator">not connected</div>
  <script type="module">
    import { invoke } from "https://esm.sh/@tauri-apps/api";
    const btn = document.getElementById("login");
    const errBox = document.getElementById("error");
    const indicator = document.getElementById("indicator");
    btn.addEventListener("click", async () => {
      errBox.textContent = "";
      btn.disabled = true;
      try {
        const session = await invoke("login", {
          baseUrl: (document.getElementById("base_url")).value,
          owner: (document.getElementById("owner")).value,
        });
        indicator.textContent = `connected as ${session.owner}`;
      } catch (e) {
        errBox.textContent = (e && e.message) || JSON.stringify(e);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
