[package]
name        = "adnet-gossip"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Topic-based pub/sub gossip overlay (iroh-gossip parity, iroh-net-ready trait)."

[lints]
workspace = true

[dependencies]
adnet-types = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
tracing     = { workspace = true }
anyhow      = { workspace = true }
chrono      = { workspace = true }
hex         = { workspace = true }

# iroh-backed gossip transport. Pulls in `iroh-gossip` (which depends
# on iroh itself via `iroh-base` for EndpointId re-export). When the
# `iroh` feature is on, callers can swap `InProcessGossip` for
# `IrohGossipTransport` behind the same `GossipTransport` trait,
# gaining HyParView+PlumTree epidemic broadcast trees on top of
# iroh's QUIC transport.
iroh-gossip = { version = "=0.101.0", optional = true, default-features = false, features = ["net"] }
iroh        = { version = "=1.0.3", optional = true, default-features = false, features = ["tls-ring"] }

[dev-dependencies]
tokio = { workspace = true }

[features]
# Default: only `InProcessGossip` is available. The `iroh` feature
# adds `IrohGossipTransport` (in `transport::iroh_gossip`) backed by
# iroh-gossip's epidemic broadcast trees.
default = []
iroh = ["dep:iroh-gossip", "dep:iroh"]
