[package]
name        = "adnet-blobstore"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Disk-backed BLAKE3 chunked content store (iroh-blobs layout parity)."

[lints]
workspace = true

[dependencies]
adnet-types         = { workspace = true }
adnet-observability = { workspace = true }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
blake3       = { workspace = true }
hex          = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
once_cell    = { workspace = true }
parking_lot  = { workspace = true }
rand         = { workspace = true, features = ["small_rng"] }
chrono       = { workspace = true }
# Encrypted blob store support: AEAD (XChaCha20-Poly1305) for chunk
# encryption + Argon2id for passphrase-derived keys. Both live in
# the workspace dep set so the same versions are used across crates.
chacha20poly1305 = { workspace = true }
argon2           = { workspace = true }
zeroize          = { workspace = true }

# iroh-backed blob store adapter. When the `iroh` feature is on,
# callers can build an `IrohBlobStore` next to a regular `BlobStore`
# and route reads/writes through iroh-blobs' Bao-verified QUIC
# protocol. The on-disk layout is a separate redb database under
# `<data_dir>/iroh-blobs/` so the legacy directory-per-hash layout
# is preserved.
iroh-blobs = { version = "=0.103.0", optional = true, default-features = false, features = ["fs-store"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true }
proptest = "1.4"
rand = { workspace = true }

[features]
# Default: only the legacy `BlobStore` is available. The `iroh`
# feature adds `IrohBlobStore` (in `iroh_store`) backed by iroh-blobs'
# Bao-verified fs store.
default = []
iroh = ["dep:iroh-blobs"]
scope = []
bitswap = []
car = []
# GraphSync DAG-sync support: re-exports the wire envelope,
# `GraphSyncClient` / `GraphSyncServer` / `MockGraphSyncTransport` /
# `MemDagStore` from the `graphsync` module so callers can drive the
# protocol against the on-disk `BlobStore` (or an in-memory store).
# The QUIC bridge / dispatcher wiring lives in `adnet-node` under
# the same feature gate.
graphsync = []
