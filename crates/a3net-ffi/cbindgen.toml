# cbindgen — C-ABI header generation for `a3net-ffi`.
#
# Mirrors the iroh-ffi pattern: cbindgen consumes the Rust
# source and emits a header that the Swift / Kotlin / WASM /
# Unity embedders include. The header is checked in
# (`include/a3net_ffi.h`) so reviewers can read it without a
# build step, but the CI workflow runs `cbindgen --verify` so
# drift between the Rust source and the header breaks the
# build, not the embedder.
#
# The header filename / include guard (`a3net_ffi.h`,
# `A3NET_FFI_H`) and the exported error-enum identifiers are
# the canonical `a3net` names. The previous `adnet` brand is
# retained as deprecated aliases in the Rust source; cbindgen
# picks up the deprecated constants/types and emits them too
# (see the `exclude` list below — it's curated so the
# generated header doesn't double-emit the constants / structs).
#
# The [parse.expand] / [parse.parse_deps] flags are inherited
# from the iroh-ffi config so deep type aliases (e.g.
# `tokio::runtime::Runtime` ← `a3net_node::Node`) resolve
# instead of getting stringified as `opaque`.

header = "/*\n * a3net_ffi.h — C ABI for the A3Net mobile surface.\n *\n * AUTO-GENERATED by cbindgen. DO NOT EDIT.\n *\n * The Rust source lives in `crates/a3net-ffi/src/lib.rs` and\n * friends. Re-generate with:\n *\n *     cbindgen --config cbindgen.toml --crate a3net-ffi \\\n *         --output include/a3net_ffi.h\n *\n * The header filename and `A3NET_FFI_H` include guard are\n * the canonical `a3net` brand. The previous `adnet` brand\n * is kept as deprecated Rust-level aliases; the generated\n * header only emits the canonical names (the [export]\n * `exclude` list filters the `Adnet*` aliases so we don't\n * double-emit the constants / structs).\n *\n * CI runs `cbindgen --verify` so a drift between the Rust\n * source and this header fails the build.\n */\n"
trailer = "/* end of cbindgen output */\n"
include_guard = "A3NET_FFI_H"
autogen_warning = "/* AUTO-GENERATED — regenerate with cbindgen. */\n"
language = "C"
cpp_compat = true
documentation = true
documentation_length = "short"
line_length = 100
tab_width = 4
sort_by = "Name"
usize_is_size_t = true

[defines]
"feature = iroh" = "1"
"feature = news" = "1"
"target_os = ios" = "1"
"target_os = android" = "1"
"target_os = linux" = "1"
"target_os = macos" = "1"
"target_os = windows" = "1"
"target_arch = wasm32" = "1"

[export]
include = []
exclude = [
    # Legacy `Adnet*` aliases kept for embedders that have not
    # been updated since the rename; the canonical `a3net`
    # names are emitted above so external callers can switch
    # over at their own pace.
    "AdnetFfiError",
    "AdnetFfiHandle",
    "AdnetFfiBuffer",
    "AdnetFfiStatus",
    "ADNET_FFI_OK",
    "ADNET_FFI_E_INVALID_ARG",
    "ADNET_FFI_E_UTF8",
    "ADNET_FFI_E_JSON",
    "ADNET_FFI_E_NODE",
    "ADNET_FFI_E_RUNTIME",
    "ADNET_FFI_E_FEATURE",
    "ADNET_FFI_E_PROFILE",
]

[parse]
parse_deps = true
include = [
    "a3net-ffi",
    "a3net-types",
    "a3net-node",
    "a3net-transport",
    "a3net-roster",
    "a3net-userstore",
]
exclude = [
    "a3net-news",
    "a3net-chatstore",
    "a3net-blobstore",
    "a3net-dht",
    "a3net-gossip",
    "a3net-namespace",
]

[parse.expand]
crates = [
    "a3net_types",
    "a3net_node",
    "a3net_transport",
    "a3net_roster",
    "a3net_userstore",
]
features = ["iroh"]

[fn]
rename_args = "CamelCase"
sort_by = "Name"
args = "auto"

[struct]
rename_fields = "CamelCase"

[enum]
rename_variants = "CamelCase"
add_sentinel = true

[const]
allow_static_const = true

[ptr]
non_null_attribute = "a3net_ffi_owned_ptr"
nullable_attribute = "a3net_ffi_nullable_ptr"