[package]
name        = "adnet-share"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "P2P file & directory sharing — sendme-style ticket flow on top of iroh-blobs."

[lints]
workspace = true

[dependencies]
# ADNet workspace siblings.
adnet-types         = { workspace = true }
adnet-blobstore     = { workspace = true }
adnet-observability = { workspace = true }

# Async / IO.
tokio       = { workspace = true, features = ["fs", "rt-multi-thread", "macros"] }
async-trait = { workspace = true }
futures     = { workspace = true }

# Errors / serialisation / time.
thiserror  = { workspace = true }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
postcard   = { workspace = true }
tracing    = { workspace = true }
chrono     = { workspace = true }
hex        = { workspace = true }

# Directory walk + post-quantum-safe name canonicalisation.
walkdir = "2"
once_cell = "1"

# Conditional iroh-backed receive path.
# When the `iroh` feature is on, callers can hand an `Arc<iroh::Endpoint>`
# to `receive` and we'll connect via the live iroh runtime. Without
# the feature, callers go through the `BlobStore` HTTP mesh fallback.
iroh          = { version = "=1.0.3", optional = true, default-features = false, features = ["tls-ring"] }
iroh-blobs    = { version = "=0.103.0", optional = true, default-features = false, features = ["fs-store"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
# Default: pure ADNet-only path, no iroh dependency. Receive uses the
# `adnet-blobstore::BlobStore` HTTP mesh fallback. The full p2p Bao
# pull-through requires the `iroh` feature.
default = []
iroh = ["dep:iroh", "dep:iroh-blobs", "adnet-blobstore/iroh"]