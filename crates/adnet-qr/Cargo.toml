[package]
name        = "adnet-qr"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = "MPL-2.0"
repository  = { workspace = true }
authors     = { workspace = true }
description = "ADNet QR payloads, chatmail-compatible provisioning parsers, and SVG rendering."

[lints]
workspace = true

[features]
default = ["adnet-types", "adnet-token", "pairing"]
# Enable conversion of DCLOGIN payloads into adnet-mail::Account values.
mail = ["dep:adnet-mail"]
# Recognise `adnet-pairing://…` URLs as a typed payload carrying a
# `PairingInvitation`. Pulled in by default so chat / pairing flows
# can render or scan a pairing QR without an extra feature flag.
pairing = ["dep:adnet-pairing"]

[dependencies]
# ADNet protocol integrations are optional so the generic QR renderer/parser
# can also be embedded by small clients (e.g. an installer that only needs
# to render a `qrcodegen` SVG without pulling in adnet-types).
adnet-types   = { workspace = true, optional = true }
adnet-token   = { workspace = true, optional = true }
adnet-mail    = { workspace = true, optional = true }
adnet-pairing = { workspace = true, optional = true }

base64           = { version = "0.22", default-features = false, features = ["std"] }
percent-encoding = "2.3"
qrcodegen        = "1.8"
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
url              = "2.5"

[dev-dependencies]
# Used by the pairing roundtrip tests to mint wallets and to read
# the local wall-clock for expiry comparisons.
adnet-identity = { workspace = true }
chrono         = "0.4"
