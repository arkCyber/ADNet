[package]
name = "adnet-model-catalog"
description = "AI Model Distribution Network - Decentralized model catalog and P2P distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Workspace dependencies
adnet-types = { workspace = true }
adnet-blobstore = { workspace = true, features = ["iroh"] }
adnet-gossip = { workspace = true, features = ["iroh"] }
adnet-identity = { workspace = true }
adnet-reputation = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
hex = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "serde"] }

# Iroh dependencies (optional, feature-gated)
iroh = { workspace = true, optional = true }
iroh-blobs = { workspace = true, optional = true }
iroh-gossip = { workspace = true, optional = true }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HTTP server for web UI (optional)
axum = { version = "0.8", features = ["macros"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
minijinja = { version = "2", optional = true }
mime = { version = "0.3", optional = true }
mime_guess = { version = "2", optional = true }

# Parking lot for async-safe mutexes
parking_lot = "0.12"

# Text wrapping for CLI
textwrap = "0.16"

[features]
default = ["server"]
iroh = [
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:iroh-gossip",
    "adnet-blobstore/iroh",
    "adnet-gossip/iroh",
]
server = [
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:minijinja",
    "dep:mime",
    "dep:mime_guess",
]
