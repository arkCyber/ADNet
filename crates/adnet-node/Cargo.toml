[package]
name        = "adnet-node"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "ADNet node — orchestrates blobstore, gossip, transport and mesh into a single runtime."

[lints]
workspace = true

[dependencies]
adnet-types     = { workspace = true }
adnet-blobstore = { workspace = true }
adnet-gossip    = { workspace = true }
adnet-ipc       = { workspace = true }
adnet-mesh      = { workspace = true }
adnet-transport = { workspace = true }
adnet-relay      = { workspace = true }
adnet-workspace  = { workspace = true }
adnet-chatstore  = { workspace = true, optional = true }
tokio            = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }
thiserror       = { workspace = true }
async-trait     = { workspace = true }
futures         = { workspace = true }
tracing         = { workspace = true }
chrono          = { workspace = true }
reqwest         = { workspace = true }
anyhow          = { workspace = true }

# iroh-backed runtime. When the `iroh` feature is on, callers can pass
# an `iroh::Endpoint` (already constructed and bound) to
# `NodeBuilder::with_iroh_endpoint` and the node will spawn an iroh
# `Router` that hosts `BlobsProtocol` + `Gossip` on top of the
# endpoint. The ADNet gossip transport and blob store are wired in
# behind the same `iroh` feature on the corresponding crates.
iroh            = { version = "=1.0.3", optional = true, default-features = false, features = ["tls-ring"] }
iroh-blobs      = { version = "=0.103.0", optional = true, default-features = false, features = ["fs-store"] }
iroh-gossip     = { version = "=0.101.0", optional = true, default-features = false, features = ["net"] }
iroh-docs       = { version = "=0.101.0", optional = true, default-features = false, features = ["fs-store"] }

# Opt-in identity/token dependencies. They pull in secp256k1, blake3,
# AES-GCM and the entire pledge/receipt state machine, which most
# production deployments don't need. Build with `cargo build -p
# adnet-node --features billing` to opt in.
adnet-identity = { workspace = true, optional = true }
adnet-token    = { workspace = true, optional = true }

[features]
# Default: pure forward-proxy node, no crypto deps for billing.
default = []
# Internal feature forwarded to `iroh-docs` so the
# `iroh_runtime::spawn` persistent-mode branch is compiled. Not
# intended to be enabled directly — opt into `iroh` instead.
fs-store = ["iroh-docs/fs-store"]
# Opt in to the relay's billing endpoints (and the helpers needed to
# sign announcements / manage a treasury). When on, `adnet-relay`'s
# own `billing` feature is also enabled.
billing = [
    "dep:adnet-identity",
    "dep:adnet-token",
    "adnet-relay/billing",
]
# Opt in to the iroh-backed runtime. Pulls in `iroh`, `iroh-blobs`,
# `iroh-gossip`, `iroh-docs`, and forwards the `fs-store` feature
# so `iroh-runtime::spawn` actually uses the persistent docs
# backend.
iroh = [
    "dep:iroh",
    "dep:iroh-blobs",
    "dep:iroh-gossip",
    "dep:iroh-docs",
    "dep:adnet-chatstore",
    "adnet-blobstore/iroh",
    "adnet-gossip/iroh",
    "adnet-transport/iroh",
    "adnet-chatstore/iroh",
    "fs-store",
]

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
adnet-identity = { workspace = true }
