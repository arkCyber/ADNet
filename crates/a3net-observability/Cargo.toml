[package]
name        = "a3net-observability"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "A3Net observability — Counter / Gauge / Histogram metrics with a Prometheus text exporter, plus distributed tracing via OpenTelemetry."

[lints]
workspace = true

[dependencies]
# Workspace members
#
# `a3net-types` is intentionally **not** a dependency here:
# `a3net-types → a3net-error → a3net-observability` would
# form a cycle, and this crate has no functional need for
# a3net-types symbols (verified via grep). Historical note:
# an earlier revision did declare the dep and broke the
# workspace's `cargo check --workspace` (see commit
# `cyclic-deps-a3net-types` for the fix).

# Async runtime / utilities
tokio            = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
async-trait      = { workspace = true }

# Serialization
serde            = { workspace = true }
serde_json       = { workspace = true }

# UUID generation
uuid            = { workspace = true }

# Time
chrono           = { workspace = true }

# Lazy globals + cheap locks
once_cell        = "1"
parking_lot      = "0.12"

# OpenTelemetry (feature-gated)
opentelemetry        = { version = "0.32", optional = true, default-features = false }
opentelemetry-otlp   = { version = "0.32", optional = true, default-features = false, features = ["grpc-tonic", "trace"] }
opentelemetry_sdk    = { version = "0.32", optional = true, default-features = false, features = ["rt-tokio", "trace"] }
tracing-opentelemetry = { version = "0.33", optional = true }
tracing-subscriber   = { workspace = true, optional = true }

# HTTP /metrics server — opt-in
axum             = { version = "0.7", optional = true, default-features = false, features = ["http1", "tokio", "json"] }

[dev-dependencies]
# Serialization
serde_json       = { workspace = true }

# Tests need a fixed clock to snapshot the Prometheus output
chrono           = { workspace = true }

# Lightweight test runtime for async metric gatherers
tokio            = { version = "1.40", features = ["macros", "rt-multi-thread", "time", "sync"] }

[features]
default = []
# Enables the axum-backed /metrics + /health HTTP server.
http-server = ["dep:axum"]

# OpenTelemetry Tracing exporters
# OTLP gRPC (e.g., otel-collector, Jaeger with OTLP, Tempo)
otlp-grpc = ["dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "dep:opentelemetry", "dep:tracing-subscriber"]
# OTLP HTTP/protobuf (alternative to gRPC)
otlp-http = ["dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry", "dep:opentelemetry", "dep:tracing-subscriber"]

# All exporters (enables all above features)
full = ["otlp-grpc"]
