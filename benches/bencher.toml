# ADNet Performance Testing Configuration
#
# This file defines the performance testing strategy for ADNet.
#
# Performance Testing Philosophy:
# 1. Measure, don't guess - all optimizations backed by benchmarks
# 2. Regression prevention - benchmarks in CI catch performance regressions
# 3. Real-world scenarios - tests simulate actual usage patterns
# 4. Resource isolation - tests run on dedicated runners to avoid noise

[benchmarks]
# Core benchmarks that must not regress
critical = [
    "blob/import/1",
    "blob/import/16",
    "blob/read_sequential/64",
    "blob/chunk_hash/16",
    "dht/kbucket_lookup",
    "gossip/fanout/100",
    "crypto/blake3/4096",
    "crypto/ed25519_sign",
    "transport/frame_encoding/1024",
]

# Important benchmarks for feature development
important = [
    "blob/read_parallel/4",
    "blob/read_parallel/16",
    "bao/tree_build/16",
    "bao/proof_verify",
    "dht/routing_table_insert/1000",
    "gossip/single_publisher/1000",
    "crypto/blake3_parallel/16",
]

# Extended benchmarks for comprehensive analysis
extended = [
    "blob/import/64",
    "bao/bao_traversal/16",
    "gossip/fanout/500",
    "dht/kbucket_split/20",
]

[thresholds]
# Thresholds for performance regression (percentage)
[thresholds.critical]
# These benchmarks should not regress at all
max_regression_pct = 5.0

[thresholds.important]
# These benchmarks allow some variance
max_regression_pct = 10.0

[thresholds.extended]
# Extended benchmarks have higher tolerance
max_regression_pct = 15.0

# Memory usage thresholds (MB)
[memory]
max_heap_size_mb = 512
max_allocations_per_test = 1000000

# Network simulation thresholds
[network.latency]
max_acceptable_p99_ms = 100
max_acceptable_jitter_ms = 20

[network.throughput]
min_bitswap_mbps = 100
min_gossip_msgs_per_sec = 10000

# Test configuration
[test]
# Number of warmup iterations
warmup_iterations = 5

# Number of measurement iterations
measurement_iterations = 100

# Minimum sample size for statistical significance
min_sample_size = 50

# Confidence level for statistical tests (95%)
confidence_level = 0.95

# Outlier detection threshold
outlier_threshold = 2.5  # Standard deviations from mean

# Performance test timeout (seconds)
test_timeout = 300

# CI-specific settings
[ci]
# Run critical benchmarks on every PR
pr_critical = true

# Run important benchmarks on main branch
main_important = true

# Run extended benchmarks nightly
nightly_extended = true

# Minimum time between baseline updates (days)
baseline_update_interval_days = 7

# Alert channels for performance regressions
[alerts]
# GitHub PR comment on regression
github_pr_comment = true

# Create issue for critical regressions
create_issue = true
issue_threshold_pct = 10.0
