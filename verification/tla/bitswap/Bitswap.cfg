\* TLA+ Configuration for ADNetBitswap
SPECIFICATION Spec

\* Invariants to check
INVARIANTS
    Inv1
    Inv2
    Inv3
    Inv4

\* Temporal properties
PROPERTIES
    L1
    L2

\* Constant definitions
CONSTANTS
    \* 4-node cluster, 3 blocks, 3 CIDs
    Node = {n1, n2, n3, n4}
    Block = {b1, b2, b3}
    CID = {c1, c2, c3}
    MaxDebt = 2

\* State constraint -- keep debt accounting bounded so the state space
\* stays finite and tractable for TLC.
STATE CONSTRAINT
    \A n, m \in Node: debt[n][m] <= MaxDebt

\* Action constraint -- force forward progress so L1/L2 are not satisfied
\* trivially by stalling.
ACTION CONSTRAINT
    \E n \in Node, c \in CID: Want(n, c)
