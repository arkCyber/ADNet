\* TLA+ Configuration for ADNetGossip
SPECIFICATION Spec

\* Invariants to check
INVARIANTS
    Inv1
    Inv2
    Inv3

\* Temporal properties
PROPERTIES
    L1

\* Constant definitions
CONSTANTS
    \* 4-node gossip cluster
    Node = {n1, n2, n3, n4}
    MsgId = {m1, m2, m3}
    Fanout = 2
    MaxHop = 2
    BufferSize = 2

\* State constraint -- upper-bounds pending/delivered buffers to keep the
\* reachable state space finite.
STATE CONSTRAINT
    \A n \in Node: Len(pending[n]) <= BufferSize

\* Action constraint -- force forward progress so L1 is not satisfied
\* trivially by stalling.
ACTION CONSTRAINT
    \E n \in Node: Push(n)
