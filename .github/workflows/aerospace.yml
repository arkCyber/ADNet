name: aerospace

# DO-178C DAL-B CI gate.
#
# Runs the aerospace-grade compliance test suite (`a3net-blobstore`
# built with `--features aerospace`) plus the rest of the
# workspace. The aerospace tests live in:
#   - crates/a3net-blobstore/tests/aerospace_compliance.rs
#   - crates/a3net-blobstore/tests/distributed_storage_aerospace.rs
#
# They are gated behind the `aerospace` feature flag so the
# certifier can rebuild from a tagged commit and get the same
# safety-revision string (`SC-2026-08-11`) that the safety case
# document references.
#
# Failure modes:
#   - any doctest/unit/integration test failure ⇒ exit 1
#   - any compiler warning ⇒ exit 1 (enforced by `RUSTFLAGS="-D warnings"`)

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

# Do not allow multiple aerospace runs to drag on the queue.
concurrency:
  group: aerospace-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1
  ADNET_SAFETY_REVISION: "SC-2026-08-11"

jobs:
  aerospace:
    name: aerospace (${{ matrix.os }}, rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: aerospace-${{ matrix.os }}-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            aerospace-${{ matrix.os }}-${{ matrix.toolchain }}-

      - name: Build (aerospace)
        run: cargo build -p a3net-blobstore --features aerospace --all-targets

      - name: Lint (aerospace)
        run: cargo clippy -p a3net-blobstore --features aerospace --all-targets -- -D warnings

      - name: Compliance suite
        run: |
          cargo test -p a3net-blobstore --features aerospace  --tests --workspace \
            -- --test-threads=1

      - name: Distributed-storage aerospace suite
        run: |
          cargo test -p a3net-blobstore --features aerospace \
            --test distributed_storage_aerospace \
            -- --test-threads=1

      - name: Document safety-revision pin
        run: |
          grep -q "$ADNET_SAFETY_REVISION" crates/a3net-blobstore/src/lib.rs \
            || (echo "SAFETY_REVISION mismatched:" && exit 1)

      - name: Coverage (cargo-llvm-cov)
        # Best-effort MC/DC surrogate. We do NOT claim this is
        # true MC/DC — that requires a DO-330-qualified tool —
        # but line coverage under the aerospace feature is the
        # best CI-side proxy we can ship today.
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          cargo install cargo-llvm-cov --locked || true
          cargo llvm-cov --workspace \
            --features a3net-blobstore/aerospace \
            --lcov --output-path coverage.lcov || true
          echo "Coverage report at coverage.lcov (informational only)"

  workspace:
    name: workspace gate
    runs-on: ubuntu-latest
    needs: aerospace
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --no-run
      - name: Doc check
        run: cargo doc --workspace --no-deps
