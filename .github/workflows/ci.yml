# ADNet CI/CD Configuration
#
# This file defines the continuous integration pipeline for ADNet.
#
# Services used:
# - GitHub Actions (primary CI)
# - Codecov (code coverage)
# - Cargo (build/test/bench)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run performance tests daily at 2 AM
    - cron: '0 2 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Enable all features for comprehensive testing
  RUSTFLAGS: "-D warnings"

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Code Quality
  # ──────────────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Run Clippy
        run: cargo clippy --all --all-features --all-targets -- -D warnings

  # ──────────────────────────────────────────────────────────────────────────
  # Test Suite
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@${{ matrix.rust }}
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-test-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        run: cargo test --workspace --all-features --no-fail-fast
      - name: Run doc tests
        run: cargo test --workspace --doc --all-features --no-fail-fast
      - name: Upload coverage
        if: matrix.rust == 'stable'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests

  # ──────────────────────────────────────────────────────────────────────────
  # Integration Tests
  # ──────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock') }}
      - name: Run network integration tests
        run: cargo test -p adnet-integration-tests --test network --no-fail-fast
      - name: Run storage integration tests
        run: cargo test -p adnet-integration-tests --test storage --no-fail-fast
      - name: Run chaos tests
        run: cargo test -p adnet-integration-tests --test chaos --no-fail-fast

  # ──────────────────────────────────────────────────────────────────────────
  # Performance Benchmarks
  # ──────────────────────────────────────────────────────────────────────────
  perf-baseline:
    name: Performance Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-perf-${{ hashFiles('**/Cargo.lock') }}
      - name: Run benchmarks
        run: |
          cargo bench -p adnet-bench -- --noplot --save-baseline main
        env:
          CARGO_BENCH_INCREMENTAL: false
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/

  perf-compare:
    name: Performance Comparison
    runs-on: ubuntu-latest
    needs: perf-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-perf-compare-${{ hashFiles('**/Cargo.lock') }}
      - name: Download baseline
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/
      - name: Run benchmarks and compare
        run: |
          cargo bench -p adnet-bench -- --noplot --load-baseline main --save-baseline current
        env:
          CARGO_BENCH_INCREMENTAL: false
      - name: Report regressions
        run: |
          # Check for significant regressions (>10%)
          echo "## Performance Report" >> $GITHUB_STEP_SUMMARY
          echo "Comparing against baseline..." >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────────────────────
  # Security Audit
  # ──────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run security audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # Fuzzing
  # ──────────────────────────────────────────────────────────────────────────
  fuzz-smoke:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz targets (brief)
        run: |
          for target in parse_announcement parse_cid parse_node_id; do
            timeout 60 cargo fuzz run $target -- -max_len=4096 -max_total_time=30 || true
          done

  # ──────────────────────────────────────────────────────────────────────────
  # Cross-platform Build
  # ──────────────────────────────────────────────────────────────────────────
  build-cross:
    name: Cross-platform Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabihf
          - wasm32-unknown-unknown
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --workspace --all-features --target ${{ matrix.target }}

  # ──────────────────────────────────────────────────────────────────────────
  # MSRV (Minimum Supported Rust Version)
  # ──────────────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV
        run: |
          rustup install 1.91
          rustup default 1.91
      - name: Build with MSRV
        run: cargo build --workspace
      - name: Test with MSRV
        run: cargo test --workspace --lib

  # ──────────────────────────────────────────────────────────────────────────
  # Documentation
  # ──────────────────────────────────────────────────────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, miri
      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
      - name: Check links
        run: cargo doc --workspace --no-deps --all-features --document-private-items

  # ──────────────────────────────────────────────────────────────────────────
  # Build Status Matrix
  # ──────────────────────────────────────────────────────────────────────────
  build-matrix:
    name: Build Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, beta, nightly]
        exclude:
          - os: windows-latest
            toolchain: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@${{ matrix.toolchain }}
      - name: Build
        run: cargo build --workspace --all-features

  # ──────────────────────────────────────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────────────────────────────────────
  summary:
    name: CI Summary
    needs: [fmt, clippy, test, integration-tests, perf-baseline, security-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "### Status" >> $GITHUB_STEP_SUMMARY
          echo "- Format: ${{ needs.fmt.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Clippy: ${{ needs.clippy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance: ${{ needs.perf-baseline.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security: ${{ needs.security-audit.result }}" >> $GITHUB_STEP_SUMMARY
