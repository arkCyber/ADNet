# ---------------------------------------------------------------------------
# Profile / lints applied workspace-wide
# ---------------------------------------------------------------------------
[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[profile.dev]
debug = 1

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# ---------------------------------------------------------------------------
# Build-time opt-in flags consumed by a3net-node (and any other future
# embedder of a3net-relay). Setting these in `[package.metadata]` lets a
# downstream Cargo build opt-in to billing without touching the
# `a3net-node` source: `cargo build -p a3net-node --features
# workspace-billing`. Member crates then forward the flag to their
# own feature gates (see `a3net-relay/billing` and `a3net-node/billing`).
# ---------------------------------------------------------------------------
[workspace.metadata.a3net]
billing_supported = true
