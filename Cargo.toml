[workspace]
resolver = "2"
# `/mobile` is a Flutter (Dart) app. Cargo's workspace discovery walks the
# whole tree by default; exclude it explicitly so `cargo metadata`, IDE
# indexing, and `cargo build` never see Flutter artifacts (build/, .dart_tool/,
# ios/, android/, web/, linux/, macos/, windows/) and never mistakenly try to
# parse `pubspec.yaml` as a Cargo manifest.
exclude = [
    "mobile",
    "mobile/**",
    "target",
    "**/target",
    "**/node_modules",
]
members = [
    "crates/a3net-types",
    "crates/a3net-error",
    "crates/a3net-observability",
    "crates/a3net-blobstore",
    "crates/a3net-crypto",
    "crates/a3net-gossip",
    "crates/a3net-dht",
    "crates/a3net-namespace",
    "crates/a3net-mesh",
    "crates/a3net-resilience",
    "crates/a3net-transport",
    "crates/a3net-ipc",
    "crates/a3net-relay",
    "crates/a3net-workspace",
    "crates/a3net-gateway",
    "crates/a3net-chatstore",
    "crates/a3net-node",
    "crates/a3net-cli",
    "crates/a3net-ipc-adapter",
    "crates/a3net-identity",
    "crates/a3net-token",
    "crates/a3net-roster",
    "crates/a3net-share",
    "crates/a3net-socialfeed",
    "crates/a3net-news",
    "crates/a3net-userstore",
    "crates/a3net-bench",
    "crates/a3net-simulator",
    "crates/a3net-fuzz",
    "crates/a3net-integration-tests",
    "crates/a3net-tui",
    "crates/a3net-security",
    "crates/a3net-database",
    "crates/a3net-nat-traversal",
    "crates/a3net-hole-punch",
    "crates/a3net-verify",
    "crates/a3net-chaos",
    "crates/a3net-mail",
    "crates/a3net-ssh",
    "crates/a3net-webdav",
    "crates/a3net-smarthome",
    "crates/a3net-magicdns",
    "crates/a3net-pairing",
    "crates/a3net-invite",
    "crates/a3net-qr",
    "crates/a3net-agent",
    "crates/a3net-tun",
    "crates/a3net-dns-server",
    "crates/a3net-chain",
    "crates/a3net-model-catalog",
    "crates/a3net-media",
    "crates/a3net-ffi",
    "crates/a3net-reputation",
    "crates/a3net-mesh-coordinator",
    "crates/a3net-mesh-firewall",
    "crates/a3net-rpc",
    "crates/a3net-webhook",
    "crates/a3net-backup",
    "crates/a3net-webrtc",
    "crates/a3net-webtransport",
    "crates/a3net-wallet-evm",
    "crates/a3chat-core",
    "crates/a3chat-crypto",
    "crates/a3chat-app",
    "crates/a3chat-rpc",
    "crates/a3chat-tauri",
    "crates/a3chat-cli",
]

# Shared metadata used by every workspace member via `{ workspace = true }`.
[workspace.package]
version     = "0.1.0"
# iroh 1.0 requires Rust 1.91 + edition 2024. We need both in order to
# link `iroh`, `iroh-blobs`, `iroh-gossip`, `iroh-relay`, `iroh-base`,
# `iroh-docs` as workspace dependencies. The `iroh` feature on
# `a3net-transport` is the canonical gate: when enabled, callers get
# NAT-traversal / DERP relay / Pkarr / Bao verification; when disabled,
# the existing quinn-based QUIC path is preserved.
edition     = "2024"
rust-version = "1.91"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/arksong/a3net"
authors     = ["A3Net Contributors"]

[workspace.dependencies]
# --- Async runtime / utilities ----------------------------------------------
tokio        = { version = "1.40", features = ["full"] }
futures      = "0.3"
async-trait  = "0.1"
async-stream = "0.3"
tokio-stream = "0.1"
thiserror    = "1.0"
anyhow       = "1.0"
once_cell    = "1.19"
parking_lot  = "0.12"

# --- Serialization ----------------------------------------------------------
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
serde_bytes    = "1.0"
bincode        = "1.3"
hex            = "0.4"
url            = { version = "2.5", features = ["serde"] }
postcard       = "1.0"
bytes          = "1.7"
base64         = "0.22"

# --- Time / IDs / Misc -------------------------------------------------------
chrono   = { version = "0.4", features = ["serde", "clock"] }
uuid     = { version = "1.10", features = ["v4", "serde"] }
tracing  = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs     = "5.0"
mailparse = "0.15"

# --- OpenTelemetry / Distributed Tracing ------------------------------------
opentelemetry = { version = "0.32", default-features = false }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["tonic", "http-proto"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["rt-tokio"] }
tracing-opentelemetry = { version = "0.27" }

# --- Crypto / content addressing --------------------------------------------
blake3 = "1.5"
sha2   = "0.10"
rand   = "0.8"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
argon2 = "0.5"
# AEAD for the optional encrypted-blob-store wrapper. XChaCha20-
# Poly1305 has a 24-byte nonce which makes random-nonce chunk
# encryption safe (no per-message nonce bookkeeping required).
chacha20poly1305 = "0.10"
# Securely wipe key material on drop — required for the encrypted
# store so the on-disk key file's contents don't linger in heap
# after the CLI exits.
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# --- Iroh (always available; members gate with `optional = true, dep:iroh`) -
iroh        = { version = "=1.0.3", default-features = false, features = ["tls-ring"] }
iroh-blobs  = { version = "=0.103.0", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
iroh-docs   = { version = "=0.101.0", default-features = false, features = ["fs-store"] }

# --- Misc small deps --------------------------------------------------------
log             = "0.4"
dashmap         = "6"
indexmap        = { version = "2", features = ["serde"] }
percent-encoding = "2"
qrcodegen       = "1.8"
http            = "1"

# --- Networking (HTTP fallback / QUIC) ---------------------------------------
reqwest = { version = "0.12", features = ["json", "stream"] }
quinn   = "0.11"
rustls  = { version = "0.23", default-features = false, features = ["ring"] }
rcgen   = "0.13"

# --- WebRTC / WebTransport ---------------------------------------------------
# `webrtc` (webrtc-rs) is the Pion port; it implements SDP, ICE, DTLS, SCTP and
# DataChannel entirely in pure Rust. The default build never pulls it in; opt-in
# via `a3net-webrtc`'s `webrtc` feature flag.
webrtc      = { version = "0.13", default-features = false }
# `snow` provides the Noise_XX handshake primitives used by the WebRTC and
# WebTransport paths. We re-use the same primitives already used by a3net-dht
# (see `a3net-dht::noise::NoiseHandshake`) so the handshake shape stays
# uniform across transports.
snow        = { version = "0.9", default-features = false, features = ["default-resolver"] }
# `wtransport` is the pure-Rust WebTransport (HTTP/3) server + client. It also
# depends on rustls + quinn, both of which are already in the tree.
wtransport  = { version = "0.7", default-features = false, features = ["ring"] }
# `pkarr` is the public-key addressable resource record system. We use it as a
# lightweight signaling channel — peer A publishes its SDP offer to
# `<hash(node_id)>.pkarr`, peer B reads it. Already a transitive dep through the
# `iroh` feature; we pin it directly under the new `webrtc` feature so the
# new path doesn't depend on `iroh`.
pkarr       = { version = "=8.0.0", default-features = false, features = ["relays"] }

# --- CLI ---------------------------------------------------------------------
clap    = { version = "4.5", features = ["derive"] }
indicatif = "0.17"

# --- Dev only ----------------------------------------------------------------
tempfile = "3"
proptest  = "1.4"

